services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: order_management_test
      POSTGRES_USER: postgres_test
      POSTGRES_PASSWORD: local_test_only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_test -d order_management_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
