services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: order_management_test
      POSTGRES_USER: postgres_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Defina TEST_DB_PASSWORD; scripts/test.ps1 e scripts/test-contract.ps1 geram uma senha automaticamente}
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_test -d order_management_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
