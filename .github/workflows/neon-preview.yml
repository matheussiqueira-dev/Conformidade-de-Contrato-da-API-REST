name: Neon preview branch

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Uma branch Neon por PR (preview/pr-<numero>), criada a partir da branch padrao do projeto e migrada pelo
# Flyway com o perfil demo (o mesmo do deploy). So roda depois de configurar vars.NEON_PROJECT_ID e
# secrets.NEON_API_KEY, e so para PRs deste repositorio: PRs de fork nao recebem secrets.
# O nome usa so o numero do PR: a delete-branch-action interpola o nome no shell, e o nome da branch git e
# texto livre de quem abre o PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}

permissions:
  contents: read

env:
  NEON_BRANCH: preview/pr-${{ github.event.number }}

jobs:
  create_neon_branch:
    name: Create Neon branch and migrate
    if: >-
      github.event.action != 'closed'
      && vars.NEON_PROJECT_ID != ''
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Expiration date (2 weeks from now)
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ${{ env.NEON_BRANCH }}
          database: ${{ vars.NEON_DATABASE || 'neondb' }}
          role: ${{ vars.NEON_ROLE || 'neondb_owner' }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests package

      # Host sem pooler: o Flyway e o set_config dos gatilhos precisam de conexao direta (docs/deploy.md).
      # A senha so chega por variavel de ambiente e nunca e impressa; o log do Flyway nao vira artefato.
      - name: Migrate with Flyway (demo profile)
        shell: bash
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://${{ steps.neon.outputs.db_host }}/${{ vars.NEON_DATABASE || 'neondb' }}?sslmode=require
          SPRING_DATASOURCE_USERNAME: ${{ vars.NEON_ROLE || 'neondb_owner' }}
          SPRING_DATASOURCE_PASSWORD: ${{ steps.neon.outputs.password }}
          SBI_DEMO_PASSWORD: ${{ secrets.SBI_DEMO_PASSWORD }}
        run: |
          # V6_1 so le a senha quando a branch pai ainda nao tem as contas demo.
          if [ -z "$SBI_DEMO_PASSWORD" ]; then
            SBI_DEMO_PASSWORD="$(openssl rand -hex 16)"
            echo "::add-mask::$SBI_DEMO_PASSWORD"
            export SBI_DEMO_PASSWORD
          fi
          timeout 300 java -jar target/order-management-spring-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=demo \
            --spring.main.web-application-type=none \
            --spring.jpa.show-sql=false > target/neon-preview.log 2>&1 || { cat target/neon-preview.log; exit 1; }
          grep -E "Successfully (applied|validated)|is up to date" target/neon-preview.log

  delete_neon_branch:
    name: Delete Neon branch
    if: >-
      github.event.action == 'closed'
      && vars.NEON_PROJECT_ID != ''
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ env.NEON_BRANCH }}
