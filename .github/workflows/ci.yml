name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: order_management_test
          POSTGRES_USER: postgres_test
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres_test -d order_management_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: |
          chmod +x mvnw
          ./mvnw -Pintegration verify

      - name: Set up Node for structural contract audit
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Audit planned contract
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node scripts/audit-contract.mjs
          npm run contract

      - name: Verify live OpenAPI and HTTP error responses
        shell: bash
        env:
          A3_CONTRACT_ISOLATED: "1"
        run: |
          export A3_TEST_PASSWORD="$(openssl rand -hex 16)"
          java -jar target/order-management-spring-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=contract \
            --server.address=127.0.0.1 --server.port=18080 \
            --spring.datasource.url=jdbc:postgresql://localhost:15432/order_management_test \
            --spring.datasource.username=postgres_test \
            --spring.datasource.password=local_test_only \
            --spring.jpa.hibernate.ddl-auto=create-drop \
            --spring.jpa.show-sql=false > target/api-ci.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat target/api-ci.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18080/v3/api-docs > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/v3/api-docs > /dev/null
          node scripts/http-contract.mjs
          node scripts/http-session.mjs
          cd frontend
          npm ci --no-audit --no-fund
          npm test
          BACKEND_ORIGIN=http://127.0.0.1:18080 npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          cd ..
          node scripts/ci-evidence.mjs

      - name: Verify Flyway schema with Hibernate validation
        shell: bash
        run: |
          java -jar target/order-management-spring-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=migration \
            --server.address=127.0.0.1 --server.port=18081 \
            --spring.datasource.url='jdbc:postgresql://localhost:15432/order_management_test?currentSchema=ci_flyway' \
            --spring.datasource.username=postgres_test \
            --spring.datasource.password=local_test_only \
            --spring.flyway.schemas=ci_flyway \
            --spring.jpa.show-sql=false > target/flyway-ci.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat target/flyway-ci.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:18081/v3/api-docs > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/v3/api-docs > /dev/null

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            target/api-ci.log
            target/flyway-ci.log
            reports/contrato/spike-2026-10-04/
            reports/contrato/session-2026-10-04/
            frontend/package-lock.json
            frontend/test-results/
            frontend/playwright-report/
