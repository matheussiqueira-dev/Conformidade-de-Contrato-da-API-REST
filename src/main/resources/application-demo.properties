# Demo profile: must be active from the first migration of the database (decision A2A-4).
# db/demo holds V6_1 (accounts with BCrypt of SBI_DEMO_PASSWORD) and V6_2 (synthetic data).
# With out-of-order disabled, enabling this profile on a database already migrated past V6 fails;
# recreate the database instead.
spring.flyway.locations=classpath:db/migration,classpath:db/demo
