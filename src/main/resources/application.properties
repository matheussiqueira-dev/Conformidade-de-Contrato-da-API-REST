spring.application.name=order-management-spring

spring.datasource.url=jdbc:postgresql://localhost:5432/order_management
spring.datasource.username=postgres
# Password comes from the SPRING_DATASOURCE_PASSWORD environment variable; never commit credentials.
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
# Migration is opt-in until the schema of each existing database is audited and baselined.
spring.flyway.enabled=false

# Session identifier is never readable by browser JavaScript.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m
