spring.application.name=order-management-spring

spring.datasource.url=jdbc:postgresql://localhost:5432/order_management
spring.datasource.username=postgres
# No default: DatasourcePasswordGuard stops startup when SPRING_DATASOURCE_PASSWORD is missing (D021). Never commit credentials.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway is the only source of the schema (decision A2); Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.jpa.hibernate.ddl-auto=validate

# Session identifier is never readable by browser JavaScript.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m
