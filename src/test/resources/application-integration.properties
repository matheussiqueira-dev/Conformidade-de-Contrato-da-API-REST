# Dedicated disposable PostgreSQL. Never use the development database here.
spring.datasource.url=jdbc:postgresql://localhost:15432/order_management_test
spring.datasource.username=postgres_test
spring.datasource.password=${TEST_DB_PASSWORD}
# Same schema as production: Flyway migrates, Hibernate validates. Tests clean business tables with TRUNCATE.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
